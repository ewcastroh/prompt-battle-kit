# Local run of the whole event (docs/DEPLOYMENT.md "Local: Docker Compose").
#   cp .env.example .env   # set both ADMIN_TOKEN_* (24+ characters)
#   docker compose up --build
#   UI  → http://localhost:4200/play/mde, /stage/mde, /admin/mde (and bog)
#   API → http://localhost:8080/actuator/health
# The API runs on the offline `fake` profile unless .env sets SPRING_PROFILES_ACTIVE= (empty) for real providers.
# ONE API instance only: the event lives in memory with a snapshot in ./data (SPEC §7.4).
name: prompt-battle

services:
  api:
    build: ./prompt-battle-api
    env_file:
      - path: .env
        required: true
    environment:
      # `-` (not `:-`): an empty value in .env means real providers, an unset one means fake.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-fake}
      DATA_DIR: /data
      # LAN_HOST (optional, in .env) lets a phone on the same Wi-Fi use the stack. A value set in .env wins over these defaults.
      PUBLIC_UI_URL: ${PUBLIC_UI_URL:-http://${LAN_HOST:-localhost}:4200}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://${LAN_HOST:-localhost}:4200}
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  ui:
    build: ./prompt-battle-ui
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://${LAN_HOST:-localhost}:8080}
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped
